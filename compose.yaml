# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  bot:
    build:
      context: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      REDIS_URL: redis://redis:6379/0
      PGSQL_USER: postgres
      PGSQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGSQL_HOST: db
      PGSQL_PORT: 5432
      PGSQL_DB: telegram-entities
    ports:
      - 8067:8067
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
     image: postgres:16-alpine
     restart: always
     volumes:
       - db-data:/var/lib/postgresql/data
     environment:
       POSTGRES_DB: telegram-entities
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
     expose:
       - 5432
     healthcheck:
       test: [ "CMD-SHELL", "pg_isready -U postgres -d telegram-entities" ]
       interval: 10s
       timeout: 5s
       retries: 5
volumes:
   db-data:
secrets:
   db-password:
     file: db/password.txt

# The commented out section below is an example of how to define a PostgreSQL
