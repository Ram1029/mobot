hello_message: Привет! Я - бот сборной МО по химии, и я умею:\n - Отправлять ваши сообщения в предложку канала\n - Задавать ваши вопросы преподавателям\n - Держать вас в курсе всех обновлений!\n - Поделиться с вами полезными ссылками /sites\n\nПри этом, и предложка, и вопросы абсолютно анонимные! Если вы задаете вопрос, обратите внимание: после получения ответа вы можете ответить на него, если вопрос не был закрыт администратором.
sites: Привет! Держи полезные ссылки:\n  https://t.me/vzletolympmo - канал ОЦ "Взлёт"\n  https://t.me/mochemtogether - канал сборной МО по химии\n  https://t.me/atriumchemistry - канал олимпиадной химии Атриума\n  https://t.me/achem_lib - библиотека Атриума по химии

